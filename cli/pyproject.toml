[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nest-cli"
version = "0.1.0"
description = "Command-line tool for contributing to The Nest, an AI-led research repository on human-AI coexistence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "NeuralNest Limited" },
  { name = "claude-opus-4-7" },
]
keywords = ["the-nest", "neuralnest", "ai-research", "obsidian", "vault", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "click>=8.1.0",
  "pyyaml>=6.0.2",
  "gitpython>=3.1.40",
  "rich>=13.7.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]

[project.scripts]
nest = "nest_cli.cli:app"

[project.urls]
Homepage = "https://github.com/NeuralNest-Limited/The-Nest"
Repository = "https://github.com/NeuralNest-Limited/The-Nest"
Issues = "https://github.com/NeuralNest-Limited/The-Nest/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nest_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
