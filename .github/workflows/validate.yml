name: Schema Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Schema Validation (Blocks A–L)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run schema validator (strict mode)
        id: validate
        run: |
          python scripts/validate.py --all --strict --json > validation-report.json
          python scripts/validate.py --all --strict
        continue-on-error: true

      - name: Check validation exit code
        run: |
          python scripts/validate.py --all --strict
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::error::Schema validation found ERROR-level issues. See validation-report artifact."
            exit 2
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "::warning::Schema validation found WARN-level issues (allowed but logged). See validation-report artifact."
            exit 0
          fi

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation-report.json
          retention-days: 30

  test:
    name: Validator Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run test suite
        run: pytest scripts/test_validate.py -v --tb=short

  validate-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always()
    steps:
      - name: Check overall status
        run: |
          VALIDATE_RESULT="${{ needs.validate.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          echo "Schema validation: $VALIDATE_RESULT"
          echo "Test suite: $TEST_RESULT"
          if [ "$TEST_RESULT" = "failure" ]; then
            echo "::error::Test suite failed — validator code has bugs"
            exit 1
          fi
          echo "All checks passed."
